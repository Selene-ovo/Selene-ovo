name: 뱀 만들기

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-snake.svg?color_snake=ff69b4&color_dots=#ffb6c1,#ff69b4,#ff1493,#db7093,#c71585
            github-snake-dark.svg?palette=github-dark&color_snake=ff69b4&color_dots=#ffb6c1,#ff69b4,#ff1493,#db7093,#c71585

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          <picture>
            <source media="(prefers-color-scheme: dark)" srcset="https://github.com/Selene-ovo/Selene-ovo/raw/output/dist/github-snake.svg" />
            <source media="(prefers-color-scheme: light)" srcset="https://github.com/Selene-ovo/Selene-ovo/raw/output/dist/github-snake.svg" />
            <img alt="뱀이 내 커밋 먹는 중 🐍" src="https://github.com/Selene-ovo/Selene-ovo/raw/output/dist/github-snake.svg" width="100%" />
          </picture>
